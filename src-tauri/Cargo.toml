[package]
name = "lewdzone"
version = "0.1.0"
description = "LewdZone Launcher - cross-platform desktop game launcher"
authors = ["LewdZone Launcher contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lewdzone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# The CLI is invoked as `lewdzone` (the GUI is "the launcher").
name = "lewdzone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
scraper = "0.27.0"
ureq = "3.4.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
