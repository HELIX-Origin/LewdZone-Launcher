name: Cross-Platform Packaging

# Builds native installers on all three platforms.
# tauri-action handles the full Rust + frontend build and produces bundles in
# src-tauri/target/release/bundle/ — Tauri's own native output location.
# No intermediate copy step is needed; artifacts are uploaded directly from there.
#
# Triggers
#   • Version-tag push  — v*  (also attaches installers to the matching release)
#   • workflow_dispatch — manual build, no release attachment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installers
          - platform: ubuntu-22.04
            artifact-name: linux-packages
          - platform: macos-latest
            artifact-name: macos-bundles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri release bundle
        # tauri-action builds the Rust binary + frontend, runs the bundler,
        # and (when triggered by a tag push) attaches the installers to the
        # existing GitHub Release for that tag.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'LewdZone Launcher ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true

      # Upload the installers Tauri produced as workflow artifacts.
      # Paths are Tauri v2's native bundle output structure.
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn
